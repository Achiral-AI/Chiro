name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer bump to publish
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      prerelease_id:
        description: Prerelease id, used only with prerelease
        required: false
        default: rc
        type: string
      dry_run:
        description: Run checks and version bump locally in CI, but do not push or publish
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Pack check
        run: npm_config_cache="$RUNNER_TEMP/npm-cache" npm pack --dry-run

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          if [ "${{ inputs.version }}" = "prerelease" ]; then
            npm version prerelease --preid "${{ inputs.prerelease_id }}" -m "Release v%s"
          else
            npm version "${{ inputs.version }}" -m "Release v%s"
          fi
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check npm token
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN"

      - name: Push version commit and tag
        if: ${{ !inputs.dry_run }}
        run: git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --notes "Published @achiral/chiro ${{ steps.version.outputs.tag }} to npm."
